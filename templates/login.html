{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:420px; margin:3rem auto;">
    <div class="card">
        <h2>🔐 Sign In</h2>
        <p class="text-muted" style="margin-bottom:1.2rem;">SecureFin Customer Portal</p>
        <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       required maxlength="30" autocomplete="username"
                       placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       required maxlength="128" autocomplete="current-password"
                       placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
        </form>
        <p style="margin-top:1rem; font-size:0.9rem;">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
